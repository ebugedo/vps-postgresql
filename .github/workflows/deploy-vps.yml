name: Deploy to VPS

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CONTAINER_NAME: vps-postgresql

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Leer configuración de PostgreSQL desde secrets.json
            POSTGRES_DB=$(jq -r '.postgresql.POSTGRES_DB' /opt/app_secrets/secrets.json)
            POSTGRES_USER=$(jq -r '.postgresql.POSTGRES_USER' /opt/app_secrets/secrets.json)
            POSTGRES_PASSWORD=$(jq -r '.postgresql.POSTGRES_PASSWORD' /opt/app_secrets/secrets.json)
            POSTGRES_PORT=$(jq -r '.postgresql.POSTGRES_PORT' /opt/app_secrets/secrets.json)
            TZ=$(jq -r '.postgresql.TZ' /opt/app_secrets/secrets.json)
            
            # Login a GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            
            # Pull de la最新 imagen
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            
            # Detener y eliminar contenedor actual (si existe)
            docker stop ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            docker rm ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            
            # Ejecutar nuevo contenedor
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              --network nginx-net \
              -p $POSTGRES_PORT:5432 \
              -e POSTGRES_DB=$POSTGRES_DB \
              -e POSTGRES_USER=$POSTGRES_USER \
              -e POSTGRES_PASSWORD=$POSTGRES_PASSWORD \
              -e TZ=$TZ \
              -v vps_postgresql_data:/var/lib/postgresql/data \
              -v /opt/app_secrets:/opt/app_secrets:ro \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            
            # Esperar a que el contenedor esté listo
            sleep 10
            
            # Verificar que el contenedor está ejecutándose
            docker ps | grep ${{ env.CONTAINER_NAME }}
            
            # Verificar health check
            docker exec ${{ env.CONTAINER_NAME }} pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            
            echo "Deploy completado exitosamente"
